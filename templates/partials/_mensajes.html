{% if messages %}
<div class="mb-3 sin-impresion">
  {% for mensaje in messages %}
  <div class="alert alert-{{ mensaje.tags }} alert-dismissible fade show d-flex align-items-start gap-2 shadow-sm"
       role="alert">
    <i class="bi bi-{% if mensaje.tags == 'success' %}check-circle{% elif mensaje.tags == 'danger' %}exclamation-octagon{% elif mensaje.tags == 'warning' %}exclamation-triangle{% else %}info-circle{% endif %} fs-5"></i>
    <div class="flex-grow-1">{{ mensaje }}</div>
    <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Cerrar"></button>
  </div>
  {% endfor %}
</div>
{% endif %}
